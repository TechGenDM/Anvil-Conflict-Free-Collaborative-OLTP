Class EscrowLog — handles uniqueness constraints via escrow/reservation protocol.

Fields:
- claims: dict[(table, col, val) -> list of (peer_id, row_pk)]

Methods:
1. __init__(self): claims = {}
2. claim(self, table: str, col: str, val: Any, peer_id: str, row_pk: Any) -> None:

   - Idempotent: don't add duplicates

4. resolve_all(self, store: CRDTStore) -> None:

Implements FK policy: TOMBSTONE
- When parent is deleted: child row survives, fk_status = "orphaned"  
- Orphaned rows ARE visible in snapshot_state (is_visible returns True if unique_status=="committed", regardless of fk_status)
- Note: update CRDTRow.is_visible() to: return not tombstone and unique_status == "committed"

Class FKEnforcer:

Methods:
1. on_parent_delete(self, store, table: str, pk: Any) -> None:

   - For each such child table, scan all rows
   - If row.cells[fk_col].winner_value() == pk: mark row.fk_status = "orphaned", upsert back

    prompt: `Write engine/sync.py for a CRDT OLTP engine in Python.

Import: EscrowLog from engine.uniqueness, FKEnforcer from engine.fk_enforcer.

Function: sync(peer_a, peer_b) -> None
Both peers are Peer objects with .store attribute.

Steps IN ORDER:

1. Merge known_peers:
   combined = peer_a.store.known_peers | peer_b.store.known_peers | {peer_a.store.peer_id, peer_b.store.peer_id}
   peer_a.store.known_peers = combined.copy()
   peer_b.store.known_peers = combined.copy()

2. Exchange ALL rows bidirectionally:
   For each table in union of both stores' tables:
     For each pk, row in peer_a's table: call peer_b.store.merge_row(table, pk, row)
     For each pk, row in peer_b's table: call peer_a.store.merge_row(table, pk, row)
   Important: snapshot both sides BEFORE merging (to avoid seeing merged state mid-sync)
   Use: a_snapshot = {t: dict(peer_a.store.get_all_rows(t)) for t in all_tables}

     peer_b.store.escrow.merge(peer_a.store.escrow)

4. Resolve uniqueness on both:
   peer_a.store.escrow.resolve_all(peer_a.store)
   peer_b.store.escrow.resolve_all(peer_b.store)

5. Recheck FK on both:
   fk = FKEnforcer()
   fk.recheck_all(peer_a.store)
   fk.recheck_all(peer_b.store)

6. GC — prune vector clocks:
   For every row in every table in both stores:
     For every cell in that row:
       cell.clock.prune(peer_a.store.known_peers)

Write 1 test: A writes row, B writes different row, sync -> both have both rows, hashes match.`

class Engine(Adapter):

    <div class="card">
      <span class="file-tag">${s.file}</span>
      <div class="card-title">${s.title}</div>
      <div class="card-sub">${s.sub}</div>
      ${s.warn ? `<div class="warn">⚠ ${s.warn}</div>` : ''}
      <div class="prompt-box" id="prompt-text">${s.prompt}</div>
      <button class="copy-btn" onclick="copyPrompt()"><i class="ti ti-copy" aria-hidden="true"></i> Copy prompt</button>
      <span id="copied-msg" style="font-size:12px; margin-left:8px; display:none;" class="copied">✓ Copied!</span>

    </div>
  `;
}

function setStep(i) { current = i; render(); }

function copyPrompt() {
  const text = document.getElementById('prompt-text').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copied-msg');
    msg.style.display = 'inline';
    setTimeout(() => msg.style.display = 'none', 2000);
  });
}

render();
</script>
